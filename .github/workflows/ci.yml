name: CCVM CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and development dependencies
        id: dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Check Python formatting
        run: black --check --config pyproject.toml app alembic tests integration ../scripts
      - name: Lint Python
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ruff check --config pyproject.toml app alembic tests integration ../scripts
      - name: Run backend tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m pytest -q
      - name: Verify real SSH handshake, pinning, authentication and read-only inventory on loopback
        run: python integration/check_host_inventory.py
      - name: Verify real NTLM handshake and mandatory encrypted WSMan messages on loopback
        run: python integration/check_winrm_http.py
      - name: Verify Neptun reconciliation safeguards
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m unittest discover -s ../scripts/tests -v

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ccvm_ci
          POSTGRES_PASSWORD: ccvm_ci_only
          POSTGRES_DB: ccvm_ci_${{ github.run_id }}_${{ github.run_attempt }}
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ccvm_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL driver, Alembic, and test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Migrate empty PostgreSQL database and verify revision, schema, and native types
        env:
          CCVM_POSTGRES_TEST_PORT: ${{ job.services.postgres.ports[5432] }}
        run: >-
          python -m pytest --confcutdir=integration integration/test_postgres_migrations.py
          -v -s --junitxml=integration-artifacts/postgres-migrations.xml
      - name: PostgreSQL service diagnostics on failure
        if: ${{ failure() }}
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker logs --tail 200 "$POSTGRES_CONTAINER"
          docker exec "$POSTGRES_CONTAINER" psql -U ccvm_ci -d "ccvm_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" -c '\dt+' -c "SELECT current_database(), current_user, version(), to_regclass('public.alembic_version');"
      - name: Preserve migration logs, schema snapshot, and test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: postgres-migrations-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/integration-artifacts/
          if-no-files-found: warn
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Check frontend dependencies for high or critical advisories
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - name: Verify network scan UI with mocked API and no scan requests
        run: |
          export CCVM_TEST_CHROMIUM="$(command -v google-chrome)"
          npm run test:network-ui
          npm run test:host-audit-ui
      - name: Preserve network UI screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: network-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-artifacts/
          if-no-files-found: ignore
      - name: Verify default API base in the built frontend
        run: node tests/check-build.mjs dist /api/v1
      - run: npm run lint
      - name: Verify frontend Docker build and nginx routes on an isolated network
        run: python3 ../scripts/check-frontend-routing.py
      - name: Verify a configured API base in a separate frontend build
        env:
          VITE_API_URL: https://ccvm-ci.invalid/api/v1
        run: |
          npm run build -- --outDir "$RUNNER_TEMP/ccvm-frontend-configured"
          node tests/check-build.mjs "$RUNNER_TEMP/ccvm-frontend-configured" https://ccvm-ci.invalid/api/v1
      - name: Check screenshot service JavaScript syntax
        run: node --check ../screenshot-service/server.js

  authenticated-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deploy and resume authenticated inventory through native HAProxy and nginx
        run: python backend/integration/authenticated_deployment.py

  host-inventory-update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update a populated old inventory release without changing the TLS gateway or keys
        run: python backend/integration/authenticated_deployment.py --host-inventory-update

  windows-patch-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add operator-only patch assessment to a populated retained inventory deployment
        run: python backend/integration/authenticated_deployment.py --windows-patch-update

  windows-patch-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify the current official MSRC catalog without host data or credentials
        run: python integration/check_windows_patch_source.py

  software-assessment-update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve existing inventories and OS assessments through the software update
        run: python backend/integration/authenticated_deployment.py --software-assessment-update

  inventory-overview-update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve populated software and OS history through the inventory overview update
        run: python backend/integration/authenticated_deployment.py --inventory-overview-update

  windows-clients-update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve the populated overview release through client and platform coverage publication
        run: python backend/integration/authenticated_deployment.py --windows-clients-update

  software-advisory-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify official software advisory ranges without customer data
        run: python integration/check_software_source.py

  gateway-mount-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify protected gateway socket mounts against disposable Docker 24
        run: python backend/integration/check_gateway_mounts.py

  windows-inventory:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify fixed read-only collector against native Windows OS and registry
        shell: powershell
        run: ./backend/integration/check_windows_inventory.ps1
      - name: Verify bounded Windows Update collector with native offline COM and deterministic online cases
        shell: powershell
        run: ./backend/integration/check_windows_updates.ps1
