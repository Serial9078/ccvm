name: CCVM CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and development dependencies
        id: dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Check Python formatting
        run: black --check app alembic tests
      - name: Lint Python
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ruff check app alembic tests
      - name: Run backend tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
